# ダッシュボードを再生成 → Surge 公開 → スクリーンショット → Slack 配信（手動実行のみ）
# 定時配信は停止済み。再開する場合は on.schedule を戻してください。
#
# GitHub リポジトリの Settings → Secrets and variables → Actions で次を設定してください:
#   SLACK_BOT_TOKEN   — Slack Bot User OAuth Token (xoxb-...)
#   SLACK_CHANNEL     — チャンネル ID (C...) またはチャンネル名
#   SURGE_DOMAIN      — 例: my-dashboard.surge.sh
#   SURGE_LOGIN       — Surge アカウントのメール
#   SURGE_TOKEN       — `npx surge token` で発行したトークン
#   GEMINI_API_KEY    — （任意）未設定なら AI 提案はフォールバック
#   GAS_URL           — （任意）未設定なら scripts/generate-dashboard.js の既定値

name: Dashboard publish → Slack (manual)

on:
  workflow_dispatch:

jobs:
  publish-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate, deploy to Surge, screenshot, post to Slack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAS_URL: ${{ secrets.GAS_URL }}
          SURGE_DOMAIN: ${{ secrets.SURGE_DOMAIN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: npm run publish:dashboard
