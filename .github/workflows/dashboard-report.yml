name: Dashboard Screenshot → Slack

on:
  schedule:
    # JST 08:00 着信狙い: GitHub Actions schedule の遅延実績 (6〜9h) を踏まえ
    # 前夜 JST 22:27 (= 13:27 UTC) に発火させる。off-minute はオンタイム混雑回避。
    - cron: '27 13 * * *'
    # JST 21:00 = UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch: # GitHub UI から手動実行も可能

jobs:
  screenshot-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshot and send to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: node scripts/screenshot-to-slack.js
